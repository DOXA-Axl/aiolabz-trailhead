# Accessibility (WCAG) check. Unlike our other checks, this one needs the site
# RUNNING — it loads each page in a headless browser and inspects it.
# Kept INFORMATIONAL (not a required gate): a11y findings become work to do,
# they don't block a release (matches the DOXA staging standard).
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest

    # Same fake public placeholders as the build — a11y builds the app first.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Build the app
        run: npm run build

      # start-server-and-test does the whole dance: start `npm run start`, wait
      # until http://localhost:3000 responds, run the accessibility scan, then
      # shut the server down — all in one step.
      - name: Run accessibility checks (pa11y-ci)
        run: >-
          npx --yes start-server-and-test
          'npm run start'
          http://localhost:3000
          'npx --yes pa11y-ci'
