# Dynamic security (DAST): probe the RUNNING site with OWASP ZAP.
# This is the "baseline" scan — passive, ~1-2 min, mostly checks security
# headers and obvious misconfigurations. It does NOT actively attack.
#
# INFORMATIONAL only (never blocks). In production this would run against the
# deployed STAGING url; here we run it against a locally-started server so you
# can learn the tool without the Vercel wiring.
name: Dynamic Security (ZAP Baseline)

on:
  # Manual button (works once this file is on main).
  workflow_dispatch:
  # Also on PRs so you can see it now. NOTE: it's slow (builds + boots + scans);
  # in a real pipeline you'd run ZAP against staging AFTER deploy, not per-PR.
  pull_request:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Build the app
        run: npm run build

      - name: Start the app in the background
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000

      # ZAP runs inside a Docker container. A container's "localhost" is itself,
      # NOT the runner host — so we target the Docker bridge gateway
      # (172.17.0.1), which points back at the host where our app is listening.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://172.17.0.1:3000'
          # fail_action: false = report findings but keep the check green
          # (informational — matches the DOXA staging standard).
          fail_action: false
          # Don't auto-open a GitHub issue for this sandbox run. (You CAN turn
          # this on later so findings become issues → and ping Teams.)
          allow_issue_writing: false
